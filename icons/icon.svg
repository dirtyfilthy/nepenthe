<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <style>
    .tile { fill: #7c5cbf; }
    @media (prefers-color-scheme: dark) { .tile { fill: #ab95e6; } }
  </style>
  <mask id="dots">
    <rect width="48" height="48" fill="#fff"/>
    <g fill="#000">
      <circle cx="9" cy="9" r="3.4"/><circle cx="19" cy="9" r="3.4"/><circle cx="29" cy="9" r="3.4"/><circle cx="39" cy="9" r="3.4"/>
      <circle cx="9" cy="19" r="3.4"/><circle cx="19" cy="19" r="3.4"/><circle cx="39" cy="19" r="3.4"/>
      <circle cx="9" cy="29" r="3.4"/><circle cx="29" cy="29" r="3.4"/>
      <circle cx="19" cy="39" r="3.4"/>
    </g>
  </mask>
  <rect class="tile" x="2" y="2" width="44" height="44" rx="9" mask="url(#dots)"/>
</svg>
